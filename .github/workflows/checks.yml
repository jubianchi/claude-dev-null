name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @anthropic-ai/claude-code@2.1.302 plugin validate .
        env:
          DISABLE_AUTOUPDATER: 1

  hooks:
    name: Hooks module
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @anthropic-ai/claude-code@2.1.302 plugin test .
      - name: Write the plugin API's types
        run: npx --yes @anthropic-ai/claude-code@2.1.302 -p /dev-null:compose --plugin-dir .
        env:
          CLAUDE_CODE_PLUGIN_DIR_WATCH: 1
      - run: npx --yes -p typescript@5.6.3 tsc -p .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck skills/commit/commit.sh tests/commit_test.sh

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: tests/commit_test.sh
      - name: Run tests with the bash 3.2 shipped with macOS
        if: runner.os == 'macOS'
        run: |
          bin="$(mktemp -d)"
          ln -s /bin/bash "$bin/bash"
          PATH="$bin:$PATH" tests/commit_test.sh
